[project]
name = "fleet-broker"
version = "0.4.0"
description = "Personal compute inventory, service registry, and resource broker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "platformdirs>=4.2",
    "filelock>=3.13",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Only for `fleet access --migrate`, which reads passwords an older fleet stored.
# Deliberately not dropped in the same release that added the migration: that would
# strand the data behind a dependency you can no longer install.
migrate = ["pyrage>=1.1"]
web = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "jinja2>=3.1", "httpx>=0.27"]
mcp = ["mcp>=1.2"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
fleet = "fleet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]

[tool.hatch.build.targets.wheel.force-include]
"src/fleet/probe/payload.sh" = "fleet/probe/payload.sh"
"src/fleet/probe/payload.ps1" = "fleet/probe/payload.ps1"

[tool.pytest.ini_options]
testpaths = ["tests"]
