[project]
name = "agents-fleet"
version = "0.6.1"
description = "Give Claude Code, Codex and Gemini every machine you have: free GPUs, running jobs, served models, installed software and data folders across your servers, over the SSH you already use, plus an MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lin Zhang" }]
keywords = [
    "claude-code", "codex", "gemini-cli", "ai-agents", "coding-agent", "mcp", "mcp-server",
    "gpu", "gpu-monitoring", "nvidia", "vram", "ssh", "tailscale", "llm", "vllm", "ollama",
    "homelab", "mlops", "devops", "inventory", "remote-execution", "vast-ai", "runpod",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Clustering",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "platformdirs>=4.2",
    "filelock>=3.13",
    "psutil>=5.9",
    # The MCP server is part of every install, so one launch line -- `uvx agents-fleet
    # mcp` -- works for every client and registry, with no extra to remember.
    "mcp>=2",
]

[project.urls]
Homepage = "https://github.com/lion-zhang/fleet"
Documentation = "https://agents-fleet.dev/"
Issues = "https://github.com/lion-zhang/fleet/issues"

[project.optional-dependencies]
# Kept so `agents-fleet[mcp]` in older notes still resolves; mcp is a core dependency now.
mcp = []

[dependency-groups]
dev = ["pytest>=8"]
# The documentation site (mkdocs.yml); not installed by `uv sync`.
docs = ["mkdocs-material==9.7.7", "mkdocs>=1.6,<2"]

[project.scripts]
fleet = "fleet.cli:main"
# The package's own name too, so `uvx agents-fleet ...` runs without `--from`: uv looks
# for an executable named after the package it was given.
agents-fleet = "fleet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]

[tool.hatch.build.targets.wheel.force-include]
"src/fleet/probe/payload.sh" = "fleet/probe/payload.sh"
"src/fleet/probe/payload.ps1" = "fleet/probe/payload.ps1"

[tool.pytest.ini_options]
testpaths = ["tests"]
