[project]
name = "fleet-broker"
version = "0.3.0"
description = "Personal compute inventory, service registry, and resource broker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "platformdirs>=4.2",
    "filelock>=3.13",
    "psutil>=5.9",
    # secrets are a core feature, not an add-on: a broker that syncs secrets.age
    # and cannot decrypt it is worse than one that never received it.
    "pyrage>=1.1",
]

[project.optional-dependencies]
web = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "jinja2>=3.1", "httpx>=0.27"]
mcp = ["mcp>=1.2"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
fleet = "fleet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]

[tool.hatch.build.targets.wheel.force-include]
"src/fleet/probe/payload.sh" = "fleet/probe/payload.sh"

[tool.pytest.ini_options]
testpaths = ["tests"]
