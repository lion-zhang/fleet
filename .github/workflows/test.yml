name: tests

on:
  # A branch with a pull request is tested by the pull_request run; testing its pushes
  # too ran every commit twice and sent every failure twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS: where fleet is mostly run, and the two the suite was written
        # on. Windows is supported as a target and a center, and has its own skips.
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - run: uv run pytest -q
