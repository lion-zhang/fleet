name: tests

on:
  # A branch with a pull request is tested by the pull_request run; testing its pushes
  # too ran every commit twice and sent every failure twice.
  push:
    branches: [main, claude/continue-fleet-development-y01p2j]   # TEMP: while Windows is brought up
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Every OS fleet runs on: the user's Windows machine found what Linux and macOS
        # runs could not (top's termios, ssh's exec), so Windows runs the suite too.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - run: uv run pytest -q
